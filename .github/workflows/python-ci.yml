name: Python CI (Hermes-first)

# The single tested contract: a clean-user Hermes install. Unit/contract tests
# plus the real-Hermes onboarding smoke lane. Replaces the retired Rust ci.yml.

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"
      - "release/**"

jobs:
  tests:
    name: unit + contract tests
    runs-on: ubuntu-latest
    env:
      PYTHON_BIN: .venv/bin/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Pinned exactly, not `@v10`: setup-uv publishes no floating `vN` tag
      # past v7, so the latest release is the only way to stay current.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Create venv and install test deps
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python pytest
      - name: Provider contract gates + Python unit tests
        run: ./test-all.sh
      - name: Repo gates
        run: bash scripts/checks.sh

  lint:
    name: lint, types, shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install the linters (same commands as .pre-commit-config.yaml)
        run: |
          uv tool install ruff==0.16.0
          uv tool install mypy
          uv tool install shellcheck-py
      - name: Build the wheel (proves the dynamic version resolves)
        run: uv build --wheel --out-dir /tmp/wheel && ls /tmp/wheel
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format
        run: ruff format --check src tests
      - name: Types (mypy)
        run: mypy
      - name: Shell (shellcheck)
        run: shellcheck -S warning install.sh scripts/*.sh bench/*.sh

  hermes-onboarding:
    name: clean-user Hermes onboarding (pinned)
    runs-on: ubuntu-latest
    env:
      # Pin is a contract: Hermes' plugin CLI discovery internals are what
      # `hermes mnemosyne` depends on. Latest PyPI release at time of writing.
      HERMES_AGENT_VERSION: "0.19.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Smoke test (fresh venv + fresh HERMES_HOME + real Hermes)
        run: bash scripts/smoke-hermes-onboarding.sh
