name: Python CI (Hermes-first)

# The tested contracts: the provider's unit/contract gates, the lite surface's
# unit tests, lint/type/shell, and a clean-user Hermes install. The matrix
# mirrors what the README claims: Python 3.11-3.14 on Linux, macOS and Windows
# for the unit tests, and the onboarding smoke lane on Linux and macOS (it needs
# real symlinks, so it cannot run on Windows).

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"
      - "release/**"

jobs:
  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # astral-sh/setup-uv v10.2.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7

      - name: Create venv and install test deps
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python ${{ matrix.python }} .venv
          if [[ -x .venv/bin/python ]]; then
            py="$PWD/.venv/bin/python"
          else
            py="$PWD/.venv/Scripts/python.exe"
          fi
          echo "PYTHON_BIN=$py" >> "$GITHUB_ENV"
          uv pip install --python "$py" pytest pytest-cov

      - name: Provider contract gates + Python unit tests
        shell: bash
        run: ./test-all.sh

      - name: Repo gates
        shell: bash
        run: bash scripts/checks.sh

  lint:
    name: lint, types, shell
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # astral-sh/setup-uv v10.2.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7

      - name: Install the linters (same commands as .pre-commit-config.yaml)
        run: |
          uv tool install ruff==0.16.0
          uv tool install mypy
          uv tool install shellcheck-py

      - name: Build the wheel (proves the dynamic version resolves)
        run: uv build --wheel --out-dir /tmp/wheel && ls /tmp/wheel

      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format
        run: ruff format --check src tests
      - name: Types (mypy)
        run: mypy
      - name: Shell (shellcheck)
        run: shellcheck -S warning install.sh scripts/*.sh bench/*.sh

  hermes-onboarding:
    name: onboarding (${{ matrix.os }}, hermes ${{ matrix.hermes }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The currently published and audited Hermes releases in the support
        # range; widen this only after CONTRACT_AUDIT.md and smoke coverage.
        hermes: ["0.18.2", "0.19.0"]
    env:
      # The pin is a contract: `hermes mnemosyne` depends on Hermes' plugin CLI
      # discovery internals.
      HERMES_AGENT_VERSION: ${{ matrix.hermes }}
    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # astral-sh/setup-uv v10.2.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - name: Smoke test (fresh venv + fresh HERMES_HOME + real Hermes)
        run: bash scripts/smoke-hermes-onboarding.sh
