name: Python CI (Hermes-first)

# The single tested contract: a clean-user Hermes install. Unit/contract tests
# plus the real-Hermes onboarding smoke lane. Replaces the retired Rust `ci.yml`.

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"
      - "release/**"

jobs:
  tests:
    name: unit + contract tests
    runs-on: ubuntu-latest
    env:
      PYTHON_BIN: .venv/bin/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Create venv and install test deps
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python pytest pytest-asyncio
      - name: Vendored provider drift gate
        run: .venv/bin/python tests/test_vendored_provider.py
      - name: Provider loader contract
        run: .venv/bin/python tests/test_provider_loader.py
      - name: Python unit/contract tests (no LLM)
        run: ./test-all.sh --skip-llm
      - name: Repo gates
        run: bash scripts/checks.sh

  hermes-onboarding:
    name: clean-user Hermes onboarding (pinned)
    runs-on: ubuntu-latest
    env:
      # Pin is a contract: Hermes' plugin CLI discovery internals are what
      # `hermes mnemosyne` depends on. Latest PyPI release at time of writing.
      HERMES_AGENT_VERSION: "0.19.0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Smoke test (fresh venv + fresh HERMES_HOME + real Hermes)
        run: bash scripts/smoke-hermes-onboarding.sh
