name: Upstream drift

# Weekly check of the two upstreams this repo depends on.
#
# A new `mnemosyne-memory` release means the vendored provider snapshot needs
# re-checking against the new wheel (scripts/vendor-provider-sync.sh does the
# diff; PATCHES.md says what to do about it). Hermes has no required version;
# the smoke job installs the newest `hermes-agent` and fails when onboarding
# breaks against it.
#
# The check opens (or updates) an issue when there is something to do, so a
# scheduled failure is not the only signal.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: PyPI drift check
    runs-on: ubuntu-latest
    needs: [contract-latest-engine, scorecard]
    if: always()
    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Compare PyPI against what this repo pins
        id: drift
        continue-on-error: true
        run: |
          set +e
          # The runner's system python is enough: the script is stdlib-only.
          python3 scripts/upstream-drift-check.py | tee drift-report.md
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Fetch the latest-engine contract report
        continue-on-error: true
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: contract-latest-engine
          path: ./drift-artifacts

      - name: Fetch the scorecard report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: scorecard
          path: ./scorecard-artifacts

      - name: Open or update an issue
        if: steps.drift.outputs.status != '0' || needs.contract-latest-engine.outputs.status != '0' || needs.scorecard.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Upstream drift: an upstream release needs triage"
        run: |
          set -euo pipefail
          cat > issue-body.md <<EOF
          The weekly upstream check found something to look at.

          $(cat drift-report.md)

          ---
          Engine contract against the newest mnemosyne-memory
          (ignoring the pin; see the contract-latest-engine job):

          $(cat drift-artifacts/contract-latest-engine.md 2>/dev/null || echo "(contract-latest-engine did not report)")

          ---
          Memory-quality scorecard (A/A control must be flat; a non-zero A/A
          means the instrument, not the product, regressed):

          $(cat scorecard-artifacts/scorecard.md 2>/dev/null || echo "(scorecard did not report)")

          ---
          Run: \`python scripts/upstream-drift-check.py\`

          Triage per \`integrations/hermes-provider/PATCHES.md\`. The sync
          procedure is \`scripts/vendor-provider-sync.sh\`, documented in
          \`integrations/hermes-provider/README.md\`. A re-vendor or pin change
          must pass \`./test-all.sh --require-engine\`.
          EOF

          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$TITLE\"" \
            --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body-file issue-body.md
            echo "Commented on issue #$existing"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --body-file issue-body.md
          fi

  contract-latest-engine:
    name: contract against the latest engine
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.contract.outputs.status }}
    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # astral-sh/setup-uv v10.3.2
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d

      - name: Resolve the newest mnemosyne-memory on PyPI
        id: latest
        run: |
          set -euo pipefail
          version="$(python3 scripts/upstream-drift-check.py --latest-engine)"
          echo "Resolved mnemosyne-memory $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Provider contract against mnemosyne-memory ${{ steps.latest.outputs.version }} (ignoring the pin)
        id: contract
        continue-on-error: true
        run: |
          set +e
          (
            set -euo pipefail
            uv venv --python 3.11 .venv
            py="$PWD/.venv/bin/python"
            echo "PYTHON_BIN=$py" >> "$GITHUB_ENV"
            # Newest engine, not the pin. Apply only the audited local engine
            # patches before testing the provider; the patcher refuses unknown
            # source revisions. Tee retains setup failures in the artifact.
            uv pip install --python "$py" "mnemosyne-memory[embeddings]==${{ steps.latest.outputs.version }}" pytest
            uv pip install --python "$py" --no-deps ./integrations/hermes-provider
            "$py" scripts/apply_engine_patches.py
            # A green run plus the drift diff is the evidence a pin bump needs;
            # a red run blocks it.
            MNEMOSYNE_REQUIRE_ENGINE=1 "$py" tests/test_provider_engine_contract.py
          ) 2>&1 | tee contract-latest-engine.md
          status=${PIPESTATUS[0]}
          echo "Exit status: $status" | tee -a contract-latest-engine.md
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload contract report
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: contract-latest-engine
          path: contract-latest-engine.md


  scorecard:
    name: memory-quality scorecard
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.scorecard.outputs.status }}
    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # astral-sh/setup-uv v10.3.2
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d

      - name: Install the pinned patched engine
        run: |
          set -euo pipefail
          uv venv --python 3.11 .venv
          py="$PWD/.venv/bin/python"
          echo "PYTHON_BIN=$py" >> "$GITHUB_ENV"
          # The pin comes from the provider's pyproject (single source).
          uv pip install --python "$py" ./integrations/hermes-provider pytest
          "$py" scripts/apply_engine_patches.py

      - name: Scorecard (held-out, 12,559 probes)
        id: scorecard
        continue-on-error: true
        run: |
          set +e
          (
            set -euo pipefail
            mkdir -p .scorecard
            "$PYTHON_BIN" -m bench.scorecard.cli corpus --output .scorecard/corpus.json
            for spec in "baseline:installed:" "aa:installed:" \
                        "abstain:installed:MNEMOSYNE_RECALL_ABSTAIN_IDENTIFIERS=1" \
                        "temporal:installed:MNEMOSYNE_CAPTURE_TEMPORAL=1" \
                        "supersede:installed:MNEMOSYNE_CAPTURE_SUPERSEDE=1"; do
              IFS=: read -r arm patch envspec <<< "$spec"
              env_prefix=()
              [ -n "$envspec" ] && env_prefix=("$envspec")
              env "${env_prefix[@]}" "$PYTHON_BIN" -m bench.scorecard.cli run \
                --arm "$arm" --engine-patch "$patch" \
                --corpus .scorecard/corpus.json \
                --output ".scorecard/arm-$arm.json" --workers 4
            done
            "$PYTHON_BIN" -m bench.scorecard.cli compare \
              --baseline .scorecard/arm-baseline.json \
              --candidate .scorecard/arm-abstain.json \
              --corpus .scorecard/corpus.json \
              --output .scorecard/compare-abstain.json
            "$PYTHON_BIN" -m bench.scorecard.cli compare \
              --baseline .scorecard/arm-baseline.json \
              --candidate .scorecard/arm-temporal.json \
              --corpus .scorecard/corpus.json \
              --output .scorecard/compare-temporal.json
            "$PYTHON_BIN" -m bench.scorecard.cli compare \
              --baseline .scorecard/arm-baseline.json \
              --candidate .scorecard/arm-supersede.json \
              --corpus .scorecard/corpus.json \
              --output .scorecard/compare-supersede.json
            # A/A control: the instrument must show no difference.
            "$PYTHON_BIN" -m bench.scorecard.cli compare \
              --baseline .scorecard/arm-baseline.json \
              --candidate .scorecard/arm-aa.json \
              --corpus .scorecard/corpus.json \
              --output .scorecard/compare-aa.json
            "$PYTHON_BIN" -c 'import json,sys; a=json.load(open(".scorecard/compare-aa.json"))["paired"]["tool"]; bad=[n for n,b in a.items() if n!="surface" and b["difference"]["excludes_zero"]]; print("A/A non-zero differences:", bad or "none"); sys.exit(1 if bad else 0)'
          ) 2>&1 | tee scorecard.md
          status=${PIPESTATUS[0]}
          echo "Exit status: $status" | tee -a scorecard.md
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload scorecard report
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scorecard
          path: |
            scorecard.md
            .scorecard/compare-*.json
            .scorecard/arm-*.json
          if-no-files-found: warn

  smoke-latest-hermes:
    name: smoke against the latest hermes-agent
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # astral-sh/setup-uv v10.3.2
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d

      - name: Resolve the newest hermes-agent on PyPI
        id: latest
        run: |
          set -euo pipefail
          version="$(python3 scripts/upstream-drift-check.py --latest-hermes)"
          echo "Resolved hermes-agent $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Clean-user onboarding against ${{ steps.latest.outputs.version }}
        env:
          HERMES_AGENT_VERSION: ${{ steps.latest.outputs.version }}
        run: bash scripts/smoke-hermes-onboarding.sh
