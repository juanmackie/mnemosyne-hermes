name: Release wheels

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-test-release:
    name: Build, install-test, and release wheels
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # astral-sh/setup-uv v10.2.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7

      - name: Build both distributions
        shell: bash
        run: |
          set -euo pipefail
          wheels="$RUNNER_TEMP/mnemosyne-wheels"
          mkdir -p "$wheels"
          uv build --wheel --out-dir "$wheels"
          (cd integrations/hermes-provider && uv build --wheel --out-dir "$wheels")
          ls -lh "$wheels"
          version="${GITHUB_REF_NAME#v}"
          python3 - "$wheels" "$version" <<'PY'
          import pathlib
          import sys

          wheels, version = pathlib.Path(sys.argv[1]), sys.argv[2]
          matches = list(wheels.glob(f"mnemosyne_lite-{version}-*.whl"))
          if len(matches) != 1:
              raise SystemExit(
                  f"tag version {version} does not match exactly one lite wheel: {matches}"
              )
          if not list(wheels.glob("mnemosyne_hermes_provider-*.whl")):
              raise SystemExit("provider wheel was not built")
          PY

      - name: Install-test release wheels in a fresh venv
        shell: bash
        run: |
          set -euo pipefail
          wheels="$RUNNER_TEMP/mnemosyne-wheels"
          venv="$RUNNER_TEMP/release-install-test"
          uv venv --python 3.11 "$venv"
          py="$venv/bin/python"
          MNEMOSYNE_EMBEDDINGS_OFF=1 uv pip install --python "$py" "$wheels"/*.whl
          MNEMOSYNE_EMBEDDINGS_OFF=1 "$py" - <<'PY'
          import importlib.metadata
          import importlib.resources
          import mnemosyne.core.beam
          import mnemosyne_lite
          import hermes_memory_provider

          assert importlib.metadata.version("mnemosyne-lite") == mnemosyne_lite.__version__
          assert importlib.resources.files(hermes_memory_provider).joinpath("plugin.yaml").is_file()
          print("PASS: both release wheels and the pinned engine import in a fresh venv")
          PY
          "$venv/bin/mnemosyne-lite" --help >/dev/null

      - name: Publish GitHub release with tested wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "$RUNNER_TEMP"/mnemosyne-wheels/*.whl
          --title "$GITHUB_REF_NAME" --generate-notes
