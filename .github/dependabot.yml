# Dependabot configuration.
#
# Two ecosystems, three directories:
#   - GitHub Actions: the workflows pin full commit SHAs (see
#     .github/workflows/python-ci.yml), so Dependabot is what keeps those pins
#     current without anyone hand-resolving tags.
#   - pip at the root: the lite surface's dev dependency (pytest).
#   - pip in integrations/hermes-provider: the engine pin
#     (mnemosyne-memory[embeddings]>=3.15.1,<3.16). A bump inside that range is
#     routine; widening the range is not — the upper bound is a contract, and
#     widening it requires re-running CONTRACT_AUDIT.md and re-vendoring per
#     PATCHES.md. Review those PRs as contract changes, not chores.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      dev:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: pip
    directory: "/integrations/hermes-provider"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "provider"
