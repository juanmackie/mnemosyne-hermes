[project]
# NAMED mnemosyne-lite, NOT mnemosyne: the engine (mnemosyne-memory) owns the
# `mnemosyne` distribution name, the `mnemosyne` import package and the
# `mnemosyne` console script. Installing this project under that name merged two
# different `mnemosyne/__init__.py`/`cli.py` files into one package (breaking
# `from mnemosyne import Mnemosyne`) and replaced the engine's script. See
# integrations/hermes-provider/README.md.
name = "mnemosyne-lite"
version = "2.4.0"
description = "Standalone SQLite memory store with a CLI and an MCP stdio server."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # Core memory requires only Python stdlib (sqlite3, threading, hashlib).
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
mnemosyne-lite = "mnemosyne_lite.cli:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mnemosyne_lite*", "lib*"]
exclude = ["tests*", "docs*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# `integrations/hermes-provider/` is a byte-hashed upstream snapshot
# (VENDORED_FROM.json); its style is upstream's business, and every edit there
# costs a PATCHES.md entry plus a manifest hash update. force-exclude keeps it
# out even when a path is passed explicitly, which is how editors and LSP
# runners invoke ruff.
extend-exclude = ["integrations/hermes-provider/hermes_memory_provider"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # line length is `ruff format`'s job, not a lint rule here
    "SIM108",  # a ternary is not always clearer than if/else
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False is how a plain-assert suite reports a failure

[tool.mypy]
# Type-check the code this repo owns, in the same scope as pyright.
files = ["src/lib", "src/mnemosyne_lite", "tests"]
python_version = "3.11"
ignore_missing_imports = true

[tool.pyright]
# The vendored snapshot's optional engine imports are absent in a bare venv and
# editing it costs a PATCHES.md entry plus a manifest hash update, so its
# diagnostics are ignored rather than chased.
include = ["src/lib", "src/mnemosyne_lite", "tests"]
ignore = ["integrations/hermes-provider/hermes_memory_provider"]
