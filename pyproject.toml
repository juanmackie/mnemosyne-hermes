[project]
# NAMED mnemosyne-lite, NOT mnemosyne: the engine (mnemosyne-memory) owns the
# `mnemosyne` distribution name, the `mnemosyne` import package and the
# `mnemosyne` console script. Installing this project under that name merged two
# different `mnemosyne/__init__.py`/`cli.py` files into one package (breaking
# `from mnemosyne import Mnemosyne`) and replaced the engine's script. See
# integrations/hermes-provider/README.md.
name = "mnemosyne-lite"
version = "2.4.0"
description = "Self-hostable Python memory system with SQLite storage, MCP/CLI surface, and optional multi-agent orchestration."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # Core memory requires only Python stdlib (sqlite3, threading, hashlib).
]

[project.optional-dependencies]
orchestration = [
    "dspy-ai>=3.0.3",
    "anthropic>=0.72.0",
    "claude-agent-sdk>=0.1.0",
    "rich>=13.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
mnemosyne-lite = "mnemosyne_lite.cli:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mnemosyne_lite*", "lib*"]
exclude = ["tests*", "benchmark*", "docs*"]

[tool.pytest.ini_options]
markers = [
    "integration: Integration tests that require an active Hermes model/proxy or legacy API key (deselect with '-m \"not integration\"')",
    "slow: Slow-running tests that can be skipped for quick validation",
]
asyncio_mode = "auto"
