[project]
name = "mnemosyne-orchestration"
version = "1.0.0"
description = "Multi-agent orchestration system for Mnemosyne with Python-native storage"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.72.0",
    "claude-agent-sdk>=0.1.0",
    "dspy-ai>=3.0.3",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: Integration tests that require an active Hermes model/proxy or legacy API key (deselect with '-m \"not integration\"')",
    "slow: Slow-running tests that can be skipped for quick validation",
]
asyncio_mode = "auto"