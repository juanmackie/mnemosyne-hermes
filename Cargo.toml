[package]
name = "mnemosyne"
version = "2.3.3"
edition = "2021"
authors = ["Mnemosyne Contributors"]
description = "Project-aware agentic memory system for Claude Code"
license = "MIT"

[[bin]]
name = "mnemosyne"
path = "src/main.rs"

[[bin]]
name = "mnemosyne-ics"
path = "src/bin/ics.rs"
required-features = ["ics-syntax"]

[[bin]]
name = "mnemosyne-dash"
path = "src/bin/dash/main.rs"
required-features = ["dashboard"]

[[bin]]
name = "mnemosyne-rpc"
path = "src/bin/mnemosyne-rpc.rs"
required-features = ["rpc"]

# Legacy vector-storage integration tests require the gated rusqlite module
[[test]]
name = "integration_vector_storage"
required-features = ["legacy-vector-store"]

[lib]
name = "mnemosyne_core"
crate-type = ["cdylib", "rlib"]  # cdylib for Python, rlib for Rust binary

[dependencies]
# Async runtime (optimized features instead of "full")
tokio = { version = "1.35", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "tracing"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# HTTP server for event streaming API
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# SSE client for event subscription
eventsource-client = "0.13"

# Database
libsql = { version = "0.9", features = ["core", "replication", "sync"] }
libsql_migration = { version = "0.2", features = ["dir"] }

# Vector search (dual storage approach)
rusqlite = { version = "0.32", optional = true, features = ["bundled", "vtab"] }
sqlite-vec = { version = "0.1.1", optional = true }
deadpool-sqlite = { version = "0.9", optional = true }  # Connection pooling for rusqlite

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
bincode = "1.3"

# LLM Integration
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Local embeddings with ONNX Runtime (auto-downloads binaries)
# Optional ONNX local embeddings; the default keeps deterministic keyword/hash
# embeddings so a personal-agent install has no model runtime or download.
fastembed = { version = "5.2", features = ["ort-download-binaries"], optional = true }

# Utilities
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
config = "0.13"
clap = { version = "4.4", features = ["derive", "env"] }
async-trait = "0.1"
regex = "1.10"
rand = "0.8"
atty = "0.2"  # Terminal detection for ICS
rustc_version_runtime = "0.3"  # Runtime Rust version for status command
lru = "0.12"  # LRU cache for semantic highlighting
once_cell = "1.19"  # Lazy static initialization for regex patterns

# CRDT for ICS collaborative editing
automerge = "0.5"

# Built-in secrets management (no external tools needed)
age = { version = "0.11", features = ["armor", "cli-common"] }
secrecy = "0.10"
directories = "5.0"

# Cryptographic signatures for cross-process authentication
hmac = "0.12"
sha2 = "0.10"

# Optional keyring fallback for backward compatibility
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native"], optional = true }

# Memory profiling (optional, for diagnostics)
tikv-jemallocator = { version = "0.6", optional = true }

# Python integration (PyO3)
pyo3 = { version = "0.22", features = ["abi3"], optional = true }
dirs = "6.0.0"
nix = { version = "0.30.1", features = ["process", "signal"] }

# Actor system and distributed networking
ractor = "0.13"
ractor_cluster = { version = "0.13", optional = true }
iroh = { version = "0.28", optional = true }

# TUI framework
ratatui = "0.29"
crossterm = "0.29"

# ICS (Integrated Context Studio) dependencies
# Text editing
ropey = "1.6"
# Parsing and lexing
tree-sitter = { version = "~0.23", optional = true }
tree-sitter-md = { version = "0.3", optional = true }  # Modern markdown parser (replaces tree-sitter-markdown)
tree-sitter-rust = { version = "~0.23", optional = true }
tree-sitter-python = { version = "~0.23", optional = true }
tree-sitter-typescript = { version = "~0.23", optional = true }
tree-sitter-javascript = { version = "~0.23", optional = true }
tree-sitter-json = { version = "~0.23", optional = true }
tree-sitter-toml-ng = { version = "0.7", optional = true }    # Modern TOML parser (replaces tree-sitter-toml)
tree-sitter-yaml = { version = "0.7", optional = true }       # Separate versioning scheme
tree-sitter-bash = { version = "~0.23", optional = true }
tree-sitter-go = { version = "~0.23", optional = true }
tree-sitter-c = { version = "~0.23", optional = true }
tree-sitter-cpp = { version = "~0.23", optional = true }
# Symbol completion and fuzzy matching
nucleo = "0.5"

# Error reporting
ariadne = "0.4"

# PTY support
portable-pty = "0.8"

# gRPC server (optional, for RPC feature)
tonic = { version = "0.12", features = ["transport", "tls"], optional = true }
prost = { version = "0.13", optional = true }
prost-types = { version = "0.13", optional = true }
tonic-reflection = { version = "0.12", optional = true }
tonic-health = { version = "0.12", optional = true }

[features]
# Keep the default personal-agent build keyless and local. OS keyring support
# remains available explicitly with `--features keyring-fallback`.
default = []
python = ["pyo3"]
keyring-fallback = ["keyring"]
local-embeddings = ["dep:fastembed"]
# Tree-sitter grammars remain available for the full ICS editor, but are not
# shipped in the default memory-provider binary.
ics-syntax = [
    "dep:tree-sitter", "dep:tree-sitter-md", "dep:tree-sitter-rust",
    "dep:tree-sitter-python", "dep:tree-sitter-typescript",
    "dep:tree-sitter-javascript", "dep:tree-sitter-json", "dep:tree-sitter-toml-ng",
    "dep:tree-sitter-yaml", "dep:tree-sitter-bash", "dep:tree-sitter-go",
    "dep:tree-sitter-c", "dep:tree-sitter-cpp",
]
# Convenience profile for source builds that want every currently optional
# local feature without changing the minimal release default.
full = ["local-embeddings", "ics-syntax", "dashboard"]
dashboard = []
distributed = ["ractor_cluster", "dep:iroh"]
profiling = ["tikv-jemallocator"]
rpc = ["tonic", "prost", "prost-types"]
rpc-reflection = ["rpc", "tonic-reflection"]
rpc-health = ["rpc", "tonic-health"]
# Legacy rusqlite+sqlite-vec vector store (src/storage/vectors.rs).
# OFF by default: bundling a second SQLite alongside libsql produced
# duplicate symbols and could silently drop libsql's vector functions
# (vector32/vector_distance_cos) at link time. libsql has native vector
# support; enable this only if you specifically need the legacy path.
legacy-vector-store = ["dep:rusqlite", "dep:sqlite-vec", "dep:deadpool-sqlite"]

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
mockall = "0.12"
proptest = "1.4"
criterion = "0.5"
tempfile = "3.8"
tokio-test = "0.4"
once_cell = "1.19"
serial_test = "3.0"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0

[[bench]]
name = "memory_benchmarks"
harness = false

[[bench]]
name = "branch_isolation_bench"
harness = false
