[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemosyne-rust-hermes"
version = "0.1.0"
description = "Hermes Agent MemoryProvider adapter for the Mnemosyne Rust binary over persistent MCP stdio."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mnemosyne Hermes integration" }]
keywords = ["hermes", "memory", "mcp", "mnemosyne"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

# The 'hermes_agent.memory_providers' entry point was removed: the Hermes plugin
# loader does not read it (it scans $HERMES_HOME/plugins/<name>/ instead), so it
# advertised a registration path that never ran. Retired with the Rust-era
# provider; the canonical provider is integrations/hermes-provider/.

[tool.setuptools]
packages = ["mnemosyne_rust_hermes"]
