# LOCAL PATCH: Hermes PM reads directory-plugin requirements from this file.
[project]
name = "hermes-mnemosyne-provider-runtime"
version = "0.1.0"
requires-python = ">=3.10"
# LOCAL PATCH (2026-10-30): sqlite-vec (the [embeddings] extra) publishes no Android
# artifact, and Hermes universal-resolves the PM workspace for every split its own
# markers imply, android included. An unmarked [embeddings] requirement therefore fails
# the whole dependency sync and the provider falls back to 'engine not importable'.
dependencies = [
    "mnemosyne-memory[embeddings]>=3.15.1,<3.16; sys_platform != 'android'",
    "mnemosyne-memory>=3.15.1,<3.16; sys_platform == 'android'",
]
